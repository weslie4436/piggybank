[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piggybank"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "qrcode>=8.2,<9",
    "tzdata>=2025.2; platform_system == 'Windows'",
]

[tool.setuptools.packages.find]
where = ["src"]
