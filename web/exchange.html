<!DOCTYPE html>
<html lang="zh-Hant" data-theme="melody">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<script>
(function () {
  function stopZoom(ev) { ev.preventDefault(); }
  document.addEventListener("gesturestart", stopZoom, { passive: false });
  document.addEventListener("gesturechange", stopZoom, { passive: false });
  document.addEventListener("dblclick", stopZoom);
})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="小豬銀行"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="theme-color" content="#ff6b9d"/>
<link rel="apple-touch-icon" href="./icons/piggy-180.png?v=4"/>
<link rel="icon" type="image/png" href="./icons/piggy-180.png?v=4"/>
<title>小豬銀行</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="./kid.css?v=3"/>
<script src="./config.js?v=1795530000"></script>
</head>
<body>
<div class="sky" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
<main class="app parent" id="hall">
  <header class="top">
    <span class="avatar"><img src="./icons/pig.png?v=3" alt=""/></span>
    <div class="hello"><small>小豬銀行</small><b id="status">父母核准</b></div>
  </header>
  <div class="ticket">
    <small>孩子想花</small>
    <p class="amount" id="exHey">讀取中…</p>
    <p class="invite-safari hint bad" id="invite-safari" hidden>請用 Safari 打開</p>
  </div>
  <p class="hint">輸入 6 位家長密碼</p>
  <div class="pin-dots gate-dots" id="gate-dots" aria-hidden="true"></div>
  <div class="pad gate-pad" id="gate-pad" role="group" aria-label="數字鍵">
    <button type="button" class="key gate-key" data-num="1">1</button><button type="button" class="key gate-key" data-num="2">2</button><button type="button" class="key gate-key" data-num="3">3</button><button type="button" class="key gate-key" data-num="4">4</button><button type="button" class="key gate-key" data-num="5">5</button><button type="button" class="key gate-key" data-num="6">6</button><button type="button" class="key gate-key" data-num="7">7</button><button type="button" class="key gate-key" data-num="8">8</button><button type="button" class="key gate-key" data-num="9">9</button>
    <span></span>
    <button type="button" class="key gate-key" data-num="0">0</button>
    <button type="button" class="key fn gate-key" data-del="1" aria-label="刪除">⌫</button>
  </div>
  <div class="qr-wait" id="invite-wait" hidden>處理中 <span class="dots3"><i></i><i></i><i></i></span></div>
</main>
<div class="mask" id="actMask" hidden>
  <div class="sheet" role="dialog">
    <div class="grip"></div>
    <div class="sheet-head"><h2 id="actTitle">說明</h2><button type="button" class="x" id="actClose" aria-label="關閉">×</button></div>
    <div id="actBody"></div>
    <button type="button" class="go mint" id="exApprove">同意這筆消費</button>
  </div>
</div>
<script src="./gate.js?v=5"></script>
<script src="./vendor/schnorr.js?v=1"></script>
<script src="./cloud.js?v=1"></script>
<script src="./exchange.js?v=8"></script>
</body>
</html>
