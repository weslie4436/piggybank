<!DOCTYPE html>
<html lang="zh-Hant" data-theme="melody">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<script>
(function () {
  function stopZoom(ev) { ev.preventDefault(); }
  document.addEventListener("gesturestart", stopZoom, { passive: false });
  document.addEventListener("gesturechange", stopZoom, { passive: false });
  document.addEventListener("dblclick", stopZoom);
})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="小豬銀行"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="theme-color" content="#ff6b9d"/>
<link rel="apple-touch-icon" href="./icons/piggy-180.png?v=4"/>
<link rel="icon" type="image/png" href="./icons/piggy-180.png?v=4"/>
<title>小豬銀行</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="./kid.css?v=1"/>
<link rel="preload" href="./icons/pig.png?v=3" as="image"/>
<script src="./config.js?v=1795339000"></script>
<script>
(function () {
  var KEY_RE = /^[A-Za-z0-9_-]{8,128}$/;
  var viewKey = (window.FAMIGATE_CONFIG && window.FAMIGATE_CONFIG.viewKeyStorage) || "piggybank.viewKey";
  var cookieRe = new RegExp("(?:^|; )" + viewKey.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "=([^;]*)");
  var stored = "";
  try { stored = localStorage.getItem(viewKey) || ""; } catch (e) {}
  var cookie = "";
  try {
    var m = document.cookie.match(cookieRe);
    cookie = m ? decodeURIComponent(m[1]) : "";
  } catch (e) {}
  var q = new URLSearchParams(location.search).get("k") || "";
  var h = "";
  try {
    var raw = (location.hash || "").replace(/^#/, "");
    if (raw.indexOf("k=") === 0) {
      h = decodeURIComponent((raw.slice(2).split("&")[0] || "").replace(/\+/g, " "));
    } else {
      h = new URLSearchParams(raw).get("k") || "";
    }
  } catch (e) {}
  var fromUrl = KEY_RE.test(q) ? q : KEY_RE.test(h) ? h : "";
  var token = fromUrl || (KEY_RE.test(stored) ? stored : "") || (KEY_RE.test(cookie) ? cookie : "");
  window.PIGGY_URL_KEY = fromUrl;
  window.PIGGY_VIEW_KEY = token;
  if (token && !fromUrl) {
    if (typeof navigator.standalone === "boolean" && !navigator.standalone) {
      var pin = location.pathname + "?k=" + encodeURIComponent(token) + "#k=" + encodeURIComponent(token);
      if (location.pathname + location.search + location.hash !== pin) {
        history.replaceState({}, "", pin);
      }
    }
  }
  var origin = window.VAULT_ORIGIN;
  if (origin) {
    var link = document.createElement("link");
    link.rel = "preconnect";
    link.href = origin;
    link.crossOrigin = "anonymous";
    document.head.appendChild(link);
  }
})();
</script>
</head>
<body>
<div class="sky" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
<div class="boot" id="boot">
  <div><img src="./icons/pig.png?v=3" alt=""/><p id="boot-text">小豬醒來中…</p></div>
</div>
<main class="app" id="app" hidden>
  <header class="top">
    <span class="avatar"><img id="face" src="./face-default.jpg?v=2" alt=""/></span>
    <div class="hello"><small>小豬銀行</small><b id="who"></b></div>
    <button type="button" class="round" id="parent-btn" aria-label="家長">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="9.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M8.3 10.5V8a3.7 3.7 0 0 1 7.4 0v2.5" fill="none" stroke="currentColor" stroke-width="1.9"/><circle cx="12" cy="15.2" r="1.4" fill="currentColor"/></svg>
    </button>
  </header>
  <section class="stage">
    <div class="pig-wrap" id="pig-wrap">
      <span class="pig-shadow"></span>
      <button type="button" class="pig" id="pig" aria-label="摸摸小豬"><img src="./icons/pig.png?v=3" alt=""/></button>
    </div>
    <span class="balance-label">小豬裡有</span>
    <button type="button" class="balance" id="balance" aria-label="存款"><span id="bal-num">0</span><span class="unit">元</span></button>
  </section>
  <section class="actions">
    <button type="button" class="big claim" id="claim" hidden>
      <img src="./icons/coin.png" alt=""/><span id="claim-text">領取</span><span class="count" id="claim-count" hidden></span>
    </button>
    <div class="wait-card" id="wait-card" hidden>下次零用錢 <b id="wait-clock">--:--:--</b></div>
    <button type="button" class="big spend" id="spend">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 8.5h11l-1 11h-9l-1-11z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9.3 8.5V7a2.7 2.7 0 0 1 5.4 0v1.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      我要買東西
    </button>
    <button type="button" class="ledger-btn" id="ledger-btn">看存錢紀錄 ›</button>
  </section>
</main>
<canvas class="fx" id="fx" aria-hidden="true"></canvas>
<script src="./gate.js?v=5"></script>
<script src="./qrcode.js?v=1"></script>
<script src="./vault-local.js?v=7"></script>
<script src="./kid.js?v=2"></script>
</body>
</html>
