<script>
(function () {
  var KEY_RE = /^[A-Za-z0-9_-]{8,128}$/;
  var viewKey = (window.FAMIGATE_CONFIG && window.FAMIGATE_CONFIG.viewKeyStorage) || "piggybank.viewKey";
  var cookieRe = new RegExp("(?:^|; )" + viewKey.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "=([^;]*)");
  var stored = "";
  try { stored = localStorage.getItem(viewKey) || ""; } catch (e) {}
  var cookie = "";
  try {
    var m = document.cookie.match(cookieRe);
    cookie = m ? decodeURIComponent(m[1]) : "";
  } catch (e) {}
  var q = new URLSearchParams(location.search).get("k") || "";
  var h = "";
  try {
    var raw = (location.hash || "").replace(/^#/, "");
    if (raw.indexOf("k=") === 0) {
      h = decodeURIComponent((raw.slice(2).split("&")[0] || "").replace(/\+/g, " "));
    } else {
      h = new URLSearchParams(raw).get("k") || "";
    }
  } catch (e) {}
  var fromUrl = KEY_RE.test(q) ? q : KEY_RE.test(h) ? h : "";
  var token = fromUrl || (KEY_RE.test(stored) ? stored : "") || (KEY_RE.test(cookie) ? cookie : "");
  window.PIGGY_URL_KEY = fromUrl;
  window.PIGGY_VIEW_KEY = token;
  if (token && !fromUrl) {
    if (typeof navigator.standalone === "boolean" && !navigator.standalone) {
      var pin = location.pathname + "?k=" + encodeURIComponent(token) + "#k=" + encodeURIComponent(token);
      if (location.pathname + location.search + location.hash !== pin) {
        history.replaceState({}, "", pin);
      }
    }
  }
  var origin = window.VAULT_ORIGIN;
  if (origin) {
    var link = document.createElement("link");
    link.rel = "preconnect";
    link.href = origin;
    link.crossOrigin = "anonymous";
    document.head.appendChild(link);
  }
})();
</script>
</head>
<body>
<div class="blobs" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
<div class="hall with-feed is-booting" id="hall">
  <div class="profile">
    <div class="boot-mark" aria-hidden="true">
      <img class="boot-pig" src="./icons/pig.png?v=3" alt=""/>
    </div>
    <h1 class="brand">小豬銀行</h1>
    <p class="status" id="status">正在連接小豬銀行…</p>
    <div class="invite-wait boot-wait">
      <div class="thinking-five" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="invite-wait-bar"></div>
    </div>
  </div>
  <div class="invite-panel" id="invite-panel" hidden>
    <p class="invite-hey">零用錢APP</p>
    <p class="invite-safari" id="invite-safari" hidden>請用 Safari 打開</p>
    <button type="button" class="invite-go" id="invite-go">開始</button>
    <form id="invite-name-form" hidden>
      <p class="err" id="invite-name-err"></p>
      <label for="invite-name">你叫什麼</label>
      <div class="apple-row">
        <input id="invite-name" autocomplete="nickname" maxlength="20" required/>
        <button type="submit" class="apple-next" aria-label="繼續">
          <svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="18"/><path d="M15.2 11.5L22.5 18l-7.3 6.5"/></svg>
        </button>
      </div>
    </form>
    <div class="invite-wait" id="invite-wait" hidden>
      <div class="thinking-five" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="invite-wait-bar" id="invite-wait-bar"></div>
    </div>
  </div>
  <div class="stage-bg" id="stage-bg" hidden></div>
  <div class="home-head" id="home-head" hidden>
    <div class="cab-hud" id="cab-hud" hidden>
      <div class="cab-wrap">
        <div class="cab-cover">
          <div class="cab-ring" aria-hidden="true"></div>
          <div class="cab-face"><img id="face-img" alt="" src="./face-default.jpg?v=2"/><span class="cab-foil" aria-hidden="true"></span></div>
          <div class="cab-mask" aria-hidden="true"></div>
        </div>
        <div id="album-settings" class="album-settings">
          <button type="button" class="ins-icon settings-toggle" aria-label="設定" aria-expanded="false">
            <span class="ins-ring"></span>
            <span class="ins-face">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.6 3.8l.6-1.3h3.6l.6 1.3 1.6.7 1.4-.5 2.5 2.5-.5 1.4.7 1.6 1.3.6v3.6l-1.3.6-.7 1.6.5 1.4-2.5 2.5-1.4-.5-1.6.7-.6 1.3h-3.6l-.6-1.3-1.6-.7-1.4.5-2.5-2.5.5-1.4-.7-1.6-1.3-.6v-3.6l1.3-.6.7-1.6-.5-1.4L6.6 4l1.4.5 1.6-.7z" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linejoin="round"/><circle cx="12" cy="11.9" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
            </span>
          </button>
        </div>
      </div>
      <p class="reader-name" id="reader-name"></p>
    </div>
    <div class="tag-board" id="tag-board" hidden>
      <div class="mode-bar" id="mode-bar">
        <button type="button" class="mode-btn is-on" data-mode="bank">銀行</button>
        <button type="button" class="mode-btn" data-mode="ledger">紀錄</button>
      </div>
    </div>
  </div>
  <div id="pig-home" class="pig-pager">
    <div class="pig-track" id="pig-track">
    <div class="pig-page" data-page="bank">
    <section id="active-pig">
      <div class="pig-stage">
        <span class="pig-ground" aria-hidden="true"></span>
        <button type="button" class="play-line is-me pig-say" id="claim-bubble" hidden>
          <span class="play-bubble">
            <span class="pig-dot" aria-hidden="true"></span>
            <p id="claim-text">有0筆零用錢可領取</p>
          </span>
        </button>
        <div class="pig-block" id="pig-block">
          <img class="pig-art" src="./icons/pig.png?v=3" alt=""/>
        </div>
        <span class="pig-coins" aria-hidden="true"></span>
      </div>
    </section>
    <section class="piggy-overview" id="pig-overview">
      <button type="button" class="money-hero" id="ovTotal" aria-label="消費">
        <span class="money-num" id="ovNum"><span class="money-digits">0</span></span>
      </button>
      <button type="button" class="adventure-launch" id="adventure-open">
        <span class="adventure-launch-mark" aria-hidden="true">✦</span>
        <span><strong>森林尋寶</strong><small>今天有新冒險</small></span>
        <span class="adventure-launch-arrow" aria-hidden="true">›</span>
      </button>
    </section>
    </div>
    <div class="pig-page" data-page="ledger">
      <div class="feed news-list" id="ledger"></div>
    </div>
    </div>
    <div class="page-dots" id="page-dots" aria-label="兩頁">
      <span class="is-on"></span>
      <span></span>
    </div>
  </div>
</div>
<section class="adventure-screen" id="adventure-screen" hidden aria-label="森林尋寶冒險">
  <header class="adventure-topbar">
    <button type="button" class="adventure-back" id="adventure-close" aria-label="返回銀行">‹</button>
    <div class="adventure-title"><span>今日冒險</span><strong>森林尋寶</strong></div>
    <div class="adventure-meter"><span id="adventure-progress">0 / 10 題</span><i><b id="adventure-progress-fill"></b></i></div>
    <button type="button" class="adventure-sound" id="adventure-sound" aria-label="音效開啟">♫</button>
  </header>
  <div class="adventure-layout">
    <section class="adventure-map-panel" aria-label="探索地圖">
      <div class="adventure-map-heading"><strong>選個地方找寶物</strong><span id="adventure-badge-total">徽章碎片 0</span></div>
      <div class="adventure-map" id="adventure-map">
        <div class="adventure-path adventure-path-a" aria-hidden="true"></div>
        <div class="adventure-path adventure-path-b" aria-hidden="true"></div>
        <button class="adventure-poi" data-poi="0" style="--x:16%;--y:25%"><span class="poi-icon">♧</span><span>樹根空地</span><i></i></button>
        <button class="adventure-poi" data-poi="1" style="--x:51%;--y:19%"><span class="poi-icon">◉</span><span>石門洞窟</span><i></i></button>
        <button class="adventure-poi" data-poi="2" style="--x:82%;--y:36%"><span class="poi-icon">✿</span><span>莓果小徑</span><i></i></button>
        <button class="adventure-poi" data-poi="3" style="--x:34%;--y:70%"><span class="poi-icon">≈</span><span>月亮池</span><i></i></button>
        <button class="adventure-poi" data-poi="4" style="--x:75%;--y:77%"><span class="poi-icon">⌂</span><span>樹冠高台</span><i></i></button>
        <div class="adventure-pig-marker"><img src="./icons/pig.png?v=3" alt="小豬冒險隊長"/></div>
      </div>
      <div class="adventure-collection" id="adventure-collection"></div>
    </section>
    <section class="adventure-scene" id="adventure-scene" aria-live="polite">
      <div class="adventure-scene-sky" aria-hidden="true"></div>
      <div class="adventure-encounter" id="adventure-encounter">
        <div class="adventure-creature-wrap"><img class="adventure-creature" src="./icons/adventure-mossling.svg?v=1" alt="森林苔苔怪"/><span class="creature-name">苔苔怪</span><div class="creature-health"><i><b id="adventure-creature-health"></b></i><small id="adventure-creature-hp">5 / 5</small></div></div>
        <div class="adventure-speech" id="adventure-speech">森林裡傳來窸窣聲，選一個地方看看吧！</div>
      </div>
      <div class="adventure-question" id="adventure-question">
        <p class="adventure-question-kicker">冒險隊長，準備好了嗎？</p>
        <h2>地圖上有好多發亮的地方</h2>
        <p>挑一個 POI，看看小豬會發現什麼。</p>
      </div>
      <div class="adventure-result" id="adventure-result" hidden></div>
    </section>
  </div>
</section>
<aside class="photo-rail" id="photo-rail" hidden aria-label="撲滿操作"></aside>

</div>

    </div>

    <div class="thinking-five" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
  </div>
</div>
<div class="batch-tag-mask" id="exchange-sheet" hidden>
  <div class="batch-tag-sheet" id="exchangeSheet">
    <div class="batch-tag-head">
      <p id="exTitle">消費</p>

    </div>
  </div>
</div>

  <p>請點底部分享，再選加入主畫面</p>
  <button type="button" class="invite-go" id="home-installed">我已加入</button>
</div>
