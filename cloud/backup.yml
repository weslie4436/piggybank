name: backup
# 每半小時把加密帳本抄進 backup/，並補回中繼站。原始檔：weslie4436/piggybank 的 cloud/。
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/archive.mjs
      - name: commit
        run: |
          git config user.name "piggybank-backup"
          git config user.email "piggybank-backup@users.noreply.github.com"
          git add backup
          git diff --cached --quiet || (git commit -m "backup $(date -u +%FT%TZ)" && git push)
